name: juren
description: 'Juren (巨人教育 / Juren Education) is a Chinese comprehensive basic-education
  training institution founded in 1994 and headquartered in Beijing (Zhongguancun, Haidian
  District). It is a B2C education and tutoring business — spanning brands such as Juren
  School, Juren 1-on-1, Xiao Juren, and Juren online school — offering courses in Chinese,
  English, mathematics, arts, study tours, and seasonal camps, plus education publishing
  and franchising. It was surfaced as a portfolio company of the venture firm Qiming and
  added to the API Evangelist network as a stub. Enrichment found NO public developer,
  API, or technical-integration surface: the historic official domain juren.com does not
  resolve (DNS), juren.ai is a parked for-sale domain, and juren.cn is a Chinese-language
  marketing mirror with no developer section. This is a non-API B2C company lead retained
  for network completeness rather than API artifact enrichment.'
